name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Compile
        run: python -m compileall -q src tests examples benchmarks
      - name: Unit and negative-path tests
        run: python -m unittest discover -s tests -v
      - name: Safety matrix
        run: python -m benchmarks.run_safety_matrix
      - name: Synthetic smart-contract flow
        run: python examples/smart_contract_release.py --evidence-root "${{ runner.temp }}/causal-cell-evidence"
      - name: Offline mixed-provider organism
        run: python examples/multi_model_organism.py
