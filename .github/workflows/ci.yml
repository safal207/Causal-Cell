name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local package
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Compile
        run: python -m compileall -q src tests examples benchmarks
      - name: Unit and negative-path tests
        run: python -m unittest discover -s tests -v
      - name: Safety matrix
        run: python -m benchmarks.run_safety_matrix
      - name: Synthetic smart-contract flow
        run: python examples/smart_contract_release.py --evidence-root "${{ runner.temp }}/causal-cell-evidence"
